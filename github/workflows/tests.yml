name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore GoatStore.DataAccess.slnx

    - name: Run tests and collect coverage
      run: dotnet test GoatStore.DataAccess.slnx --no-restore --collect:"XPlat Code Coverage"
name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    # Windows, бо LogWindowUI.Tests збирається під net8.0-windows (WPF)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 8.0 — runtime для тестів, 9.0 — SDK, який уміє читати .slnx
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore GoatStore.DataAccess.slnx

    - name: Build
      run: dotnet build GoatStore.DataAccess.slnx --no-restore

    - name: Run tests and collect coverage
      run: dotnet test GoatStore.DataAccess.slnx --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults
